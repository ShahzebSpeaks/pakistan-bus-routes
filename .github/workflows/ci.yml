name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run data:validate
      - name: Unit tests
        run: npm test
      - name: Compile data (offline)
        run: npm run data:build
      - name: Typecheck and build
        run: npm run build
